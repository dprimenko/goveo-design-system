<!DOCTYPE html>
<html lang="es" data-screen-label="Goveo App · Feed">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goveo App · Feed</title>
  <link rel="icon" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="MOCK_STORIES.jsx"></script>
  <script type="text/babel" src="GeoStoryView.jsx"></script>
  <script type="text/babel" src="FeedHeader.jsx"></script>
  <script type="text/babel" src="BottomBar.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="DownloadAppModal.jsx"></script>

  <script type="text/babel">
    function App() {
      const [tab, setTab] = React.useState("feed");
      const [sidebarOpen, setSidebarOpen] = React.useState(false);
      const [downloadOpen, setDownloadOpen] = React.useState(false);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const feedRef = React.useRef(null);

      // Auto-open download modal after 30 seconds (production fires after 45s)
      React.useEffect(() => {
        const t = setTimeout(() => setDownloadOpen(true), 30000);
        return () => clearTimeout(t);
      }, []);

      // IntersectionObserver on the feed cards to track current index
      React.useEffect(() => {
        if (!feedRef.current) return;
        const cards = feedRef.current.querySelectorAll(".gv-story");
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                const idx = Number(e.target.dataset.idx);
                setCurrentIndex(idx);
              }
            });
          },
          { threshold: 0.6 }
        );
        cards.forEach((c) => observer.observe(c));
        return () => observer.disconnect();
      }, []);

      const downloadPrompt = () => setDownloadOpen(true);

      return (
        <div className="gv-stage">
          <div className="gv-feed" ref={feedRef}>
            <FeedHeader
              onOpenSidebar={() => setSidebarOpen(true)}
              onOpenSearch={downloadPrompt}
              onSelectLocation={downloadPrompt}
            />
            {MOCK_STORIES.map((story, i) => (
              <GeoStoryView key={story.id} idx={i} story={story} onDownload={downloadPrompt} />
            ))}
          </div>
          <BottomBar selected={tab} onSelect={setTab} dark />
          {sidebarOpen && <Sidebar onClose={() => setSidebarOpen(false)} />}
          {downloadOpen && <DownloadAppModal onClose={() => setDownloadOpen(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
