<!DOCTYPE html>
<html lang="es" data-screen-label="Goveo Landing">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goveo — La Vídeo Smart City</title>
  <link rel="icon" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Banner.jsx"></script>
  <script type="text/babel" src="GeoClipExplainer.jsx"></script>
  <script type="text/babel" src="FreePlanCard.jsx"></script>
  <script type="text/babel" src="PricingGrid.jsx"></script>
  <script type="text/babel" src="HelpForm.jsx"></script>
  <script type="text/babel" src="PromoShare.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function FreePlanModal({ onClose }) {
      return (
        <div className="lp-modal" onClick={onClose}>
          <div className="lp-modal__card" onClick={(e) => e.stopPropagation()}>
            <button className="lp-modal__close" onClick={onClose}>×</button>
            <div className="lp-free__icon" style={{ marginBottom: "1.5rem" }}>
              <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
            </div>
            <h2 className="gv-poster-md" style={{ marginBottom: "1.5rem" }}>¡Empieza gratis!</h2>
            <ol className="lp-steps" style={{ marginBottom: "2rem" }}>
              <li><span className="lp-step__num">1</span><span>Descarga la aplicación Goveo.</span></li>
              <li><span className="lp-step__num">2</span><span>Regístrate como Usuario y Publisher.</span></li>
              <li><span className="lp-step__num">3</span><span>Sube tu GeoClip (Video 30 s geolocalizado).</span></li>
            </ol>
            <div style={{ borderTop: "1px solid var(--landing-border)", paddingTop: "1.5rem" }}>
              <p className="gv-eyebrow" style={{ marginBottom: "0.75rem" }}>
                Recibe los pasos en tu móvil
              </p>
              <input
                className="lp-form__highlight"
                style={{
                  width: "100%",
                  background: "rgba(255,255,255,0.05)",
                  border: "1px solid rgba(255,255,255,0.20)",
                  color: "var(--naranja-goveo)",
                  padding: "1rem",
                  borderRadius: "0.75rem",
                  textAlign: "center",
                  fontWeight: 700,
                  fontStyle: "italic",
                  fontSize: "0.875rem",
                  textTransform: "uppercase",
                  marginBottom: "0.75rem",
                  fontFamily: "var(--font-sans)",
                  outline: "none",
                  boxSizing: "border-box",
                }}
                placeholder="Tu teléfono (ej: 34600111222)"
              />
              <button className="lp-btn lp-btn--orange" style={{ width: "100%", padding: "1.25rem" }}>
                Enviarme instrucciones por WhatsApp
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [showModal, setShowModal] = React.useState(false);
      React.useEffect(() => {
        const open = () => setShowModal(true);
        window.addEventListener("lp-open-free", open);
        return () => window.removeEventListener("lp-open-free", open);
      }, []);
      return (
        <>
          <LandingBanner />
          <GeoClipExplainer />
          <FreePlanCard />
          <PricingGrid />
          <HelpForm />
          <PromoShare />
          <Footer />
          {showModal && <FreePlanModal onClose={() => setShowModal(false)} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
