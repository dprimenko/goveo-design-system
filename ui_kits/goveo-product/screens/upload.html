<!DOCTYPE html>
<html lang="es" data-screen-label="Upload GeoClip">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goveo · Subir GeoClip</title>
  <link rel="icon" href="../../../assets/favicon.png" />
  <link rel="stylesheet" href="../../../product.css" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../screens.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <style>
    .upload {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: var(--gp-space-6);
      align-items: start;
    }
    @media (max-width: 900px) {
      .upload { grid-template-columns: 1fr; }
    }

    /* Stepper */
    .stepper {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: var(--gp-space-5);
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .step__num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--bg-muted);
      color: var(--fg-muted);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: var(--gp-fs-xs);
      font-weight: 600;
      flex-shrink: 0;
    }
    .step--done .step__num { background: var(--gp-success); color: #fff; }
    .step--active .step__num { background: var(--gp-orange-500); color: #fff; }
    .step__label {
      font-size: var(--gp-fs-sm);
      color: var(--fg-muted);
      font-weight: 500;
    }
    .step--active .step__label, .step--done .step__label { color: var(--fg-default); }
    .step__line {
      flex: 1;
      height: 2px;
      background: var(--border-subtle);
      max-width: 64px;
    }
    .step--done + .step .step__line,
    .step--done.step + .step .step__line { background: var(--gp-success); }
    @media (max-width: 760px) {
      .step__label { display: none; }
      .step__line { max-width: 32px; }
    }

    /* Drop zone (file selection) */
    .drop {
      padding: var(--gp-space-10) var(--gp-space-6);
      text-align: center;
    }
    .drop .gp-file__icon { width: 64px; height: 64px; }
    .drop__small {
      display: flex; gap: 8px; justify-content: center; margin-top: 16px;
      font-size: var(--gp-fs-xs);
      color: var(--fg-subtle);
    }
    .drop__small > span { display: inline-flex; align-items: center; gap: 4px; }

    /* Phone preview */
    .preview-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--gp-radius-lg);
      padding: var(--gp-space-4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 80px;
    }
    .preview-card__head {
      align-self: stretch;
      display: flex; align-items: center; justify-content: space-between;
    }
    .phone {
      width: 240px;
      aspect-ratio: 9 / 19.5;
      border-radius: 32px;
      border: 8px solid var(--gp-ink-800);
      background: var(--gp-ink-900);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(14,16,20,0.15);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 6px; left: 50%; transform: translateX(-50%);
      width: 72px; height: 18px;
      background: var(--gp-ink-900);
      border-radius: 0 0 12px 12px;
      z-index: 3;
    }
    .phone__media {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: var(--gp-ink-700);
    }
    .phone__overlay {
      position: absolute;
      inset: 0;
      padding: 12px;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(to top, rgba(0,0,0,0.5), transparent 40%);
      color: #fff;
    }
    .phone__overlay h4 { margin: 0 0 2px; font-size: 12px; font-weight: 600; line-height: 1.3; }
    .phone__overlay p { margin: 0; font-size: 10px; opacity: 0.85; }
    .phone__overlay .pin {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 9px; margin-top: 6px; opacity: 0.85;
    }
    .phone__empty {
      position: absolute;
      inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.4);
      gap: 8px;
      font-size: 11px;
    }

    /* Sections */
    .form-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--gp-radius-md);
      padding: var(--gp-space-5);
      margin-bottom: var(--gp-space-4);
    }
    .form-section h3 {
      font-size: var(--gp-fs-md);
      font-weight: 600;
      margin: 0 0 4px;
    }
    .form-section p {
      color: var(--fg-muted);
      font-size: var(--gp-fs-sm);
      margin: 0 0 var(--gp-space-4);
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 540px) { .row-2 { grid-template-columns: 1fr; } }

    .map-pick {
      height: 220px;
      border-radius: var(--gp-radius-md);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
    }
    .map-pick__hint {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: var(--gp-radius-sm);
      font-size: var(--gp-fs-sm);
      color: var(--fg-default);
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; gap: 8px;
    }

    .duration-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-muted);
      border-radius: var(--gp-radius-sm);
      font-size: var(--gp-fs-sm);
    }
    .duration-bar__track {
      flex: 1;
      height: 6px;
      background: var(--gp-ink-100);
      border-radius: 999px;
      overflow: hidden;
    }
    .duration-bar__fill {
      height: 100%;
      width: 93%;
      background: var(--gp-orange-500);
      border-radius: 999px;
    }

    /* Sticky footer (mobile + desktop) */
    .upload__footer {
      position: sticky;
      bottom: 0;
      margin: var(--gp-space-6) calc(var(--gp-space-6) * -1) calc(var(--gp-space-6) * -1);
      padding: var(--gp-space-3) var(--gp-space-6);
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 5;
    }
    @media (max-width: 900px) {
      .upload__footer { margin: var(--gp-space-4) calc(var(--gp-space-4) * -1) calc(var(--gp-space-4) * -1); padding: var(--gp-space-3) var(--gp-space-4); }
    }
    .upload__footer .gp-btn:last-child { margin-left: auto; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="gp-product">
  <div id="root"></div>

  <script type="text/babel" src="../components/Icon.jsx"></script>
  <script type="text/babel" src="../components/Button.jsx"></script>
  <script type="text/babel" src="../components/Field.jsx"></script>
  <script type="text/babel" src="../components/Badge.jsx"></script>
  <script type="text/babel" src="../components/Card.jsx"></script>
  <script type="text/babel" src="../components/Nav.jsx"></script>
  <script type="text/babel" src="../components/Overlays.jsx"></script>

  <script type="text/babel">
    const SAMPLE_POSTER = "https://images.unsplash.com/photo-1543340904-0b1d843bccda?w=480";

    const sidebarItems = [
      { kind: "label", label: "Publicar" },
      { label: "Inicio", icon: <Icon name="house" /> },
      { label: "Mis GeoClips", icon: <Icon name="video-camera" />, badge: <Badge variant="accent">3</Badge> },
      { label: "Subir nuevo", icon: <Icon name="upload-simple" weight="fill" />, active: true },
      { label: "Productos", icon: <Icon name="package" /> },
      { label: "Eventos", icon: <Icon name="calendar" /> },
      { kind: "label", label: "Crecer" },
      { label: "Estadísticas", icon: <Icon name="chart-line" /> },
      { label: "Suscripción", icon: <Icon name="crown-simple" /> },
      { label: "Ajustes", icon: <Icon name="gear" /> },
    ];

    function App() {
      const [step, setStep] = React.useState(1);
      const [file, setFile] = React.useState(null);
      const [title, setTitle] = React.useState("");
      const [desc, setDesc] = React.useState("");
      const [category, setCategory] = React.useState("food");
      const [tags, setTags] = React.useState(["tortilla", "brunch", "sevilla"]);
      const [tagInput, setTagInput] = React.useState("");
      const [location, setLocation] = React.useState("Calle Sierpes, 64 · Sevilla");
      const [allowComments, setAllowComments] = React.useState(true);
      const [scheduleLater, setScheduleLater] = React.useState(false);
      const [publishedToast, setPublishedToast] = React.useState(false);
      const { toasts, push, close } = useToasts();

      const addTag = () => {
        const v = tagInput.trim().toLowerCase().replace(/^#/, "");
        if (v && !tags.includes(v) && tags.length < 8) {
          setTags([...tags, v]);
        }
        setTagInput("");
      };

      const hasContent = !!file || step >= 2;

      return (
        <div className="app-shell">
          <Sidebar
            brand={<><img src="../../../assets/goveo-app-icon.jpg" style={{ width: 28, height: 28, borderRadius: 6 }} /><span>Goveo</span></>}
            items={sidebarItems}
          />

          <div className="app-shell__main">
            <div className="screen">
              <div className="screen-head">
                <div className="screen-head__main">
                  <h1 className="screen-head__title">Subir un GeoClip</h1>
                  <p className="screen-head__sub">Vídeo vertical de 15 a 30 segundos. Hasta 60 MB. Se publicará tras pasar revisión de calidad.</p>
                </div>
              </div>

              {/* Stepper */}
              <div className="stepper">
                <div className={`step ${step >= 1 ? (file ? "step--done" : "step--active") : ""}`}>
                  <span className="step__num">{file && step > 1 ? <Icon name="check" size={12} weight="bold" /> : 1}</span>
                  <span className="step__label">Vídeo</span>
                </div>
                <div className="step__line" />
                <div className={`step ${step >= 2 ? (step > 2 ? "step--done" : "step--active") : ""}`}>
                  <span className="step__num">{step > 2 ? <Icon name="check" size={12} weight="bold" /> : 2}</span>
                  <span className="step__label">Detalles</span>
                </div>
                <div className="step__line" />
                <div className={`step ${step >= 3 ? "step--active" : ""}`}>
                  <span className="step__num">3</span>
                  <span className="step__label">Publicar</span>
                </div>
              </div>

              <div className="upload">
                <div>
                  {/* STEP 1 — file */}
                  {step === 1 && (
                    <div className="form-section">
                      <h3>Sube tu vídeo</h3>
                      <p>El vídeo debe ser vertical (9:16) y durar entre 15 y 30 segundos.</p>
                      <FileUpload
                        title="Arrastra el vídeo aquí"
                        hint="o haz clic para seleccionar · MP4 · vertical · ≤60 MB"
                        accept="video/mp4,video/quicktime"
                        file={file}
                        onChange={setFile}
                      />
                      <div className="drop__small">
                        <span><Icon name="phone-vertical" size={12} /> Vertical 9:16</span>
                        <span><Icon name="clock" size={12} /> 15 – 30 s</span>
                        <span><Icon name="file-video" size={12} /> ≤ 60 MB</span>
                      </div>

                      {file && (
                        <>
                          <div style={{ height: 16 }} />
                          <div className="duration-bar">
                            <Icon name="film-strip" />
                            <div className="duration-bar__track"><div className="duration-bar__fill" /></div>
                            <span className="gp-mono">0:28 / 0:30</span>
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  {/* STEP 2 — details */}
                  {step >= 2 && (
                    <>
                      <div className="form-section">
                        <h3>Detalles del GeoClip</h3>
                        <p>Una buena descripción ayuda a que los clientes encuentren tu negocio.</p>

                        <Field label="Título" required hint="Máx. 80 caracteres">
                          <Input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ej: Tortilla recién hecha · mesa libre" maxLength={80} />
                        </Field>
                        <div style={{ height: 16 }} />

                        <Field label="Descripción" hint="Máx. 280 caracteres · Aparece bajo el vídeo">
                          <Textarea value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="Cuéntale a los clientes qué hace especial este momento…" maxLength={280} />
                        </Field>
                        <div style={{ height: 16 }} />

                        <div className="row-2">
                          <Field label="Categoría" required>
                            <Select
                              value={category}
                              onChange={(e) => setCategory(e.target.value)}
                              options={[
                                { value: "food", label: "Restauración / Tapas" },
                                { value: "shop", label: "Comercio / Tienda" },
                                { value: "culture", label: "Cultura / Espectáculos" },
                                { value: "tourism", label: "Turismo / Lugares" },
                                { value: "event", label: "Evento puntual" },
                              ]}
                            />
                          </Field>
                          <Field label="Tipo de contenido">
                            <Select
                              defaultValue="presentation"
                              options={[
                                { value: "presentation", label: "Presentación del negocio" },
                                { value: "offer", label: "Oferta / promoción" },
                                { value: "event", label: "Evento" },
                                { value: "place", label: "Lugar de interés" },
                              ]}
                            />
                          </Field>
                        </div>
                      </div>

                      <div className="form-section">
                        <h3>Ubicación</h3>
                        <p>Donde aparecerá tu GeoClip en el feed cuando alguien esté cerca.</p>
                        <Field>
                          <Input
                            iconLeft={<Icon name="map-pin" weight="fill" />}
                            iconRight={<Icon name="crosshair" />}
                            value={location}
                            onChange={(e) => setLocation(e.target.value)}
                            placeholder="Busca una dirección…"
                          />
                        </Field>
                        <div style={{ height: 12 }} />
                        <div className="map-pick map-placeholder">
                          <div className="map-placeholder__pin" style={{ top: "50%", left: "50%" }} />
                          <div className="map-pick__hint">
                            <Icon name="navigation-arrow" weight="fill" size={14} />
                            <span>Arrastra el pin para ajustar la ubicación exacta</span>
                          </div>
                        </div>
                      </div>

                      <div className="form-section">
                        <h3>Etiquetas</h3>
                        <p>Hasta 8 etiquetas. Ayudan a categorizar tu contenido.</p>
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 }}>
                          {tags.map((t) => (
                            <Chip key={t} active onClose={() => setTags(tags.filter((x) => x !== t))}>#{t}</Chip>
                          ))}
                        </div>
                        <Field>
                          <Input
                            placeholder="Añadir etiqueta y pulsar Enter"
                            value={tagInput}
                            onChange={(e) => setTagInput(e.target.value)}
                            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addTag(); } }}
                            iconLeft={<Icon name="hash" />}
                          />
                        </Field>
                      </div>

                      <div className="form-section">
                        <h3>Opciones de publicación</h3>
                        <p>Estos ajustes pueden cambiarse después.</p>
                        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                          <Toggle label="Permitir comentarios" checked={allowComments} onChange={(e) => setAllowComments(e.target.checked)} />
                          <Toggle label="Programar publicación más tarde" checked={scheduleLater} onChange={(e) => setScheduleLater(e.target.checked)} />
                          {scheduleLater && (
                            <Field label="Fecha y hora" hint="Hora local de la ubicación seleccionada">
                              <Input type="datetime-local" defaultValue="2026-06-14T20:00" />
                            </Field>
                          )}
                        </div>
                      </div>
                    </>
                  )}
                </div>

                {/* Phone preview */}
                <div className="preview-card">
                  <div className="preview-card__head">
                    <div className="gp-eyebrow">Vista previa</div>
                    <Badge variant="warning" dot>Borrador</Badge>
                  </div>

                  <div className="phone">
                    {file || step >= 2 ? (
                      <>
                        <img className="phone__media" src={SAMPLE_POSTER} alt="" />
                        <div className="phone__overlay">
                          <h4>{title || "Tu título aparecerá aquí"}</h4>
                          <p>{desc || "Y la descripción del vídeo, debajo."}</p>
                          <div className="pin"><Icon name="map-pin" size={10} weight="fill" /> {location.split(" · ")[0]}</div>
                        </div>
                      </>
                    ) : (
                      <div className="phone__empty">
                        <Icon name="video-camera" size={28} />
                        <span>Sin vídeo aún</span>
                      </div>
                    )}
                  </div>

                  <div style={{ width: "100%", display: "flex", flexDirection: "column", gap: 6 }}>
                    <div className="gp-body-sm gp-muted" style={{ display: "flex", justifyContent: "space-between" }}>
                      <span>Visibilidad</span>
                      <span className="gp-strong" style={{ color: "var(--fg-default)" }}>Pública · Sevilla</span>
                    </div>
                    <div className="gp-body-sm gp-muted" style={{ display: "flex", justifyContent: "space-between" }}>
                      <span>Plan</span>
                      <span><Badge variant="accent">Platinum</Badge></span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Footer */}
              <div className="upload__footer">
                {step > 1 && (
                  <Button variant="ghost" iconLeft={<Icon name="arrow-left" />} onClick={() => setStep(step - 1)}>
                    Atrás
                  </Button>
                )}
                {step === 1 && (
                  <Button
                    variant="primary"
                    disabled={!file}
                    iconRight={<Icon name="arrow-right" />}
                    onClick={() => setStep(2)}
                    style={{ marginLeft: "auto" }}
                  >
                    Continuar
                  </Button>
                )}
                {step === 2 && (
                  <Button
                    variant="primary"
                    disabled={!title.trim()}
                    iconLeft={<Icon name="paper-plane-tilt" weight="fill" />}
                    onClick={() => { setStep(3); push({ title: "GeoClip enviado a revisión", msg: "Te avisamos cuando esté publicado.", variant: "success" }); }}
                    style={{ marginLeft: "auto" }}
                  >
                    {scheduleLater ? "Programar" : "Publicar GeoClip"}
                  </Button>
                )}
                {step === 3 && (
                  <Button
                    variant="primary"
                    iconLeft={<Icon name="check" weight="bold" />}
                    onClick={() => alert("Volver al feed")}
                    style={{ marginLeft: "auto" }}
                  >
                    Ver mis GeoClips
                  </Button>
                )}
              </div>

              {step === 3 && (
                <div style={{ marginTop: 24 }}>
                  <EmptyState
                    icon="paper-plane-tilt"
                    title="¡GeoClip en revisión!"
                    sub="Nuestro equipo lo revisa en menos de 24 h. Te avisaremos por email y push cuando esté publicado."
                  />
                </div>
              )}
            </div>
          </div>

          <ToastStack toasts={toasts} onClose={close} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
