<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body {
    background: var(--zinc-950);
    padding: 28px 32px;
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 18px 32px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
  }
  .primary  { background: #e98027; color: #fff; box-shadow: 0 4px 15px rgba(233,128,39,0.4); }
  .white    { background: #fff;    color: #000; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .outline  { background: transparent; color: #e98027; border-color: #e98027; }
  .ghost    { background: transparent; color: var(--zinc-500); border-color: var(--zinc-700); }
</style>
</head>
<body>
  <button class="btn primary">Activar Platinum</button>
  <button class="btn white">Contratar Premium</button>
  <button class="btn outline">Empieza gratis</button>
  <button class="btn ghost">Solicitar Boost</button>
</body>
</html>
