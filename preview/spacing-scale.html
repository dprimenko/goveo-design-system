<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body {
    background: #fff;
    padding: 24px 28px;
    font-family: var(--font-sans);
    color: var(--neutral-900);
  }
  h4 {
    margin: 0 0 14px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--neutral-500);
  }
  .scale {
    display: flex;
    align-items: flex-end;
    gap: 14px;
  }
  .step { text-align: center; }
  .bar {
    background: var(--primary-500);
    height: 12px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .name { font-size: 11px; font-weight: 700; color: var(--neutral-900); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .px { font-size: 10px; color: var(--neutral-500); }
</style>
</head>
<body>
  <h4>Spacing scale · powers of 2 in rem</h4>
  <div class="scale">
    <div class="step"><div class="bar" style="width:4px"></div><div class="name">--space-4</div><div class="px">4px</div></div>
    <div class="step"><div class="bar" style="width:8px"></div><div class="name">8</div><div class="px">8px</div></div>
    <div class="step"><div class="bar" style="width:16px"></div><div class="name">16</div><div class="px">16px</div></div>
    <div class="step"><div class="bar" style="width:24px"></div><div class="name">24</div><div class="px">24px</div></div>
    <div class="step"><div class="bar" style="width:32px"></div><div class="name">32</div><div class="px">32px</div></div>
    <div class="step"><div class="bar" style="width:40px"></div><div class="name">40</div><div class="px">40px</div></div>
    <div class="step"><div class="bar" style="width:48px"></div><div class="name">48</div><div class="px">48px</div></div>
    <div class="step"><div class="bar" style="width:64px"></div><div class="name">64</div><div class="px">64px</div></div>
    <div class="step"><div class="bar" style="width:80px"></div><div class="name">80</div><div class="px">80px</div></div>
    <div class="step"><div class="bar" style="width:96px"></div><div class="name">96</div><div class="px">96px</div></div>
  </div>
</body>
</html>
