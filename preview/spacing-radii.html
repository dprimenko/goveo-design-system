<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body {
    background: #fff;
    padding: 22px 28px;
    font-family: var(--font-sans);
    color: var(--neutral-900);
    display: flex;
    align-items: flex-end;
    gap: 20px;
    overflow: hidden;
  }
  .step { text-align: center; }
  .swatch {
    width: 90px;
    height: 90px;
    background: var(--primary-500);
    margin-bottom: 8px;
  }
  .pill {
    width: 90px;
    height: 36px;
    background: var(--primary-500);
    border-radius: 9999px;
    margin: 0 auto 8px;
  }
  .name { font-size: 11px; font-weight: 700; color: var(--neutral-900); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .px { font-size: 10px; color: var(--neutral-500); }
  h4 {
    position: absolute;
    top: 16px;
    left: 28px;
    margin: 0;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--neutral-500);
  }
</style>
</head>
<body>
  <h4>Radii · app tokens then landing oversize</h4>
  <div class="step"><div class="swatch" style="border-radius:4px"></div><div class="name">--radius-4</div><div class="px">4px</div></div>
  <div class="step"><div class="swatch" style="border-radius:8px"></div><div class="name">8</div><div class="px">8px</div></div>
  <div class="step"><div class="swatch" style="border-radius:16px"></div><div class="name">16</div><div class="px">16px</div></div>
  <div class="step"><div class="swatch" style="border-radius:32px"></div><div class="name">24</div><div class="px">32px</div></div>
  <div class="step"><div class="swatch" style="border-radius:48px"></div><div class="name">card-xl</div><div class="px">3rem</div></div>
  <div class="step"><div class="swatch" style="border-radius:56px"></div><div class="name">card-xxl</div><div class="px">3.5rem</div></div>
  <div class="step"><div class="swatch" style="border-radius:64px"></div><div class="name">hero</div><div class="px">4rem</div></div>
  <div class="step"><div class="pill"></div><div class="name">pill</div><div class="px">9999px</div></div>
</body>
</html>
