<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body {
    background: #fff;
    padding: 20px 26px;
    font-family: var(--font-sans);
    color: var(--neutral-900);
  }
  .title {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--neutral-500);
    margin-bottom: 14px;
  }
  .row { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon {
    width: 40px; height: 40px;
    background: var(--neutral-100);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--neutral-900);
    font-size: 22px;
  }
  .name { font-size: 10px; color: var(--neutral-600); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="title">In-product icons · @phosphor-icons (CDN)</div>
  <div class="row">
    <div class="col"><div class="icon"><i class="ph ph-map-pin"></i></div><div class="name">map-pin</div></div>
    <div class="col"><div class="icon"><i class="ph ph-list"></i></div><div class="name">list</div></div>
    <div class="col"><div class="icon"><i class="ph ph-magnifying-glass"></i></div><div class="name">search</div></div>
    <div class="col"><div class="icon"><i class="ph ph-funnel"></i></div><div class="name">funnel</div></div>
    <div class="col"><div class="icon"><i class="ph ph-shopping-cart"></i></div><div class="name">cart</div></div>
    <div class="col"><div class="icon"><i class="ph ph-heart"></i></div><div class="name">heart</div></div>
    <div class="col"><div class="icon"><i class="ph ph-share-fat"></i></div><div class="name">share-fat</div></div>
    <div class="col"><div class="icon"><i class="ph-fill ph-speaker-simple-slash"></i></div><div class="name">muted</div></div>
    <div class="col"><div class="icon"><i class="ph ph-caret-up"></i></div><div class="name">caret-up</div></div>
    <div class="col"><div class="icon"><i class="ph ph-caret-down"></i></div><div class="name">caret-down</div></div>
  </div>
</body>
</html>
