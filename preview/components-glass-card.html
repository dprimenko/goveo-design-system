<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body {
    background: var(--zinc-950);
    padding: 16px 22px;
    font-family: var(--font-sans);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(233,128,39,0.40);
    border-radius: 40px;
    padding: 22px 28px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 0 50px rgba(233,128,39,0.15);
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .pin {
    flex: 0 0 64px;
    height: 64px;
    background: #e98027;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .title {
    font-size: 22px;
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 6px;
  }
  .body {
    font-size: 12px;
    font-weight: 700;
    font-style: italic;
    color: var(--zinc-400);
    line-height: 1.35;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="pin">↓</div>
    <div>
      <div class="title">¡Empieza <span style="color:#e98027">gratis</span>!</div>
      <div class="body">Descarga la app, regístrate como Publisher y sube tu primer GeoClip (30 s, vertical, 60 MB).</div>
    </div>
  </div>
</body>
</html>
